# Настройки RabbitMQ для сервера (подключается в docker-compose.yml).

# Порог памяти — страховка у самой границы.
# RabbitMQ определяет память по всему серверу (на Netrun видит 16 ГБ) и ставит порог
# в 40 % — 6,4 ГБ, хотя контейнеру доступно около 200 МБ (1 ГБ проекта на 5 сервисов).
# Тогда при нехватке памяти его не притормозит сам RabbitMQ — процесс убьёт система.
# Пустой RabbitMQ занимает ~140 МБ (замер: RabbitMQ 3.12, без плагинов), сообщений у нас
# единицы — порог ставим чуть ниже лимита контейнера: при его превышении RabbitMQ
# придержит новые сообщения, а не упадёт. Ниже не опускать: если порог окажется ниже
# обычного потребления, каждое событие от API будет ждать 2 с и теряться.
vm_memory_high_watermark.absolute = 190MiB

# В логах — только предупреждения и ошибки (при старте было ~200 строк служебных).
log.console.level = warning
