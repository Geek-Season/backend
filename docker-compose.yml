# Запуск всего проекта одной командой:  docker compose up --build
# API:  http://localhost:8000/docs
#
# Этот файл — для сервера (Netrun и любой другой хостинг): наружу открыт только
# api на порту 8000. База, Redis и RabbitMQ видны лишь внутри сети Docker.
#
# Для разработки на компьютере добавляется docker-compose.dev.yml — он открывает
# порты базы, Redis и RabbitMQ (для PyCharm / DBeaver / тестов). Чтобы он
# подключался сам, в .env есть строки COMPOSE_FILE и COMPOSE_PATH_SEPARATOR
# (см. .env.example).
#
# Секреты (BOT_TOKEN, BOT_USERNAME, JWT_SECRET, пароли) берутся из файла .env рядом
# или из секретов хостинга.

x-app-env: &app-env
  # Внутри Docker сервисы видят друг друга по именам «db», «redis», «rabbitmq», а не localhost.
  DATABASE_URL: postgresql+psycopg://geek:${DB_PASSWORD:-geek}@db:5432/geek_season
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://geek:${RABBITMQ_PASSWORD:-geek}@rabbitmq:5672/
  # production: сервер не запустится без своего JWT_SECRET (см. app/core/config.py).
  APP_ENV: ${APP_ENV:-production}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geek
      # Пароль задаётся только при ПЕРВОМ создании базы (пустой том pgdata).
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geek}
      POSTGRES_DB: geek_season
    volumes:
      - pgdata:/var/lib/postgresql/data   # данные переживают перезапуск
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geek -d geek_season"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data                   # рейтинг и идущие пробники переживают перезапуск
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  rabbitmq:
    # Без веб-панели (management): меньше памяти и быстрее старт. На сервере панель всё равно
    # не открыть снаружи; для разработки её включает docker-compose.dev.yml.
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: geek
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-geek}
      # Проекту на Netrun дано 0,5 ядра, а Erlang запускает по планировщику на каждое ядро
      # сервера и держит их в активном ожидании — они отбирают друг у друга процессор.
      # Один планировщик без активного ожидания — меньше пустой работы при старте.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - rabbitdata:/var/lib/rabbitmq   # очереди переживают перезапуск
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-geek.conf:ro    # порог памяти, тихий лог
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro      # без плагинов: −10 МБ
    healthcheck:
      # Готов = принимает подключения на 5672. Проверка портом (nc) почти ничего не стоит;
      # rabbitmq-diagnostics запускает отдельную Erlang-машину и сам замедлял старт —
      # он остаётся только запасным вариантом, если в образе нет nc.
      # start_period: первую минуту неудачные проверки не считаются — RabbitMQ ещё загружается.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672 || rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads             # картинки и файлы к задачам переживают пересборку
    depends_on:
      db:
        condition: service_healthy   # ждём, пока база реально готова
      redis:
        condition: service_healthy
      # Не ждём, пока RabbitMQ будет готов: API работает и без брокера (события просто
      # не отправятся), а при первой же возможности переподключится сам.
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  # Фоновые процессы в одном контейнере (app/background.py):
  #   - Telegram-бот: вход по QR и /login;
  #   - воркер: достижения и уведомления из очередей RabbitMQ.
  # Отдельного сервиса bot нет: хостинг его не запускал, а два бота с одним
  # токеном мешали бы друг другу.
  worker:
    build: .
    command: ["python", "-m", "app.background"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      api:
        condition: service_started   # api применяет миграции и заполняет справочники (нужно и боту)
      rabbitmq:
        condition: service_started   # воркер сам ждёт брокер и переподключается каждые 5 секунд
    restart: on-failure

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  uploads:
