# Запуск всего проекта одной командой:  docker compose up --build
# API:  http://localhost:8000/docs
#
# Секреты (BOT_TOKEN, BOT_USERNAME, JWT_SECRET) берутся из файла .env рядом.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geek
      POSTGRES_PASSWORD: geek
      POSTGRES_DB: geek_season
    ports:
      # Снаружи порт 5433, а не 5432: 5432 часто занят PostgreSQL, установленным на компьютер.
      - "5433:5432"          # чтобы подключаться к базе из PyCharm / DBeaver / pgAdmin
    volumes:
      - pgdata:/var/lib/postgresql/data   # данные переживают перезапуск
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geek -d geek_season"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"          # снаружи 6380 — на случай, если 6379 уже занят
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: geek
      RABBITMQ_DEFAULT_PASS: geek
    ports:
      - "5672:5672"          # для API и воркера, запущенных на компьютере
      - "15672:15672"        # веб-панель: http://localhost:15672 (geek / geek)
    volumes:
      - rabbitdata:/var/lib/rabbitmq   # очереди переживают перезапуск
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Внутри Docker сервисы видят друг друга по именам «db» и «redis», а не localhost.
      DATABASE_URL: postgresql+psycopg://geek:geek@db:5432/geek_season
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://geek:geek@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # ждём, пока база реально готова
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  bot:
    build: .
    command: ["python", "-m", "app.bot"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://geek:geek@db:5432/geek_season
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://geek:geek@rabbitmq:5672/
    depends_on:
      api:
        condition: service_started   # api при старте применяет миграции
    restart: on-failure

  worker:
    build: .
    command: ["python", "-m", "app.worker"]   # достижения и уведомления из очередей RabbitMQ
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://geek:geek@db:5432/geek_season
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://geek:geek@rabbitmq:5672/
    depends_on:
      api:
        condition: service_started   # api применяет миграции и заполняет справочники
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
  rabbitdata:
